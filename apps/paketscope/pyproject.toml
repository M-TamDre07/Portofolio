[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paketscope"
version = "3.0.0.dev3"
description = "Native local-first package inventory for Debian-family desktops"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU General Public License v3.0" }
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
authors = [{ name = "Linux Software Lab" }]
dependencies = ["PySide6>=6.7", "cryptography>=42.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
paketscope = "paketscope.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["paketscope*"]

[tool.setuptools.package-data]
paketscope = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
