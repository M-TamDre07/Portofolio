name: PaketScope build

on:
  push:
    branches: [main, feature/paketscope-v3-native]
    tags: ["paketscope-v*"]
    paths:
      - "apps/paketscope/**"
      - ".github/workflows/paketscope-build.yml"
  pull_request:
    paths:
      - "apps/paketscope/**"
      - ".github/workflows/paketscope-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/paketscope
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/paketscope/pyproject.toml
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Export resolved dependencies without the editable local project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/paketscope-audit-requirements.txt"
          if grep -qiE '^paketscope([[:space:]@=]|$)' "$RUNNER_TEMP/paketscope-audit-requirements.txt"; then
            echo "Local editable PaketScope project unexpectedly appears in the external dependency audit input."
            exit 1
          fi
          grep -qiE '^PySide6==' "$RUNNER_TEMP/paketscope-audit-requirements.txt"
          grep -qiE '^cryptography==' "$RUNNER_TEMP/paketscope-audit-requirements.txt"
      - name: Install static checker and dependency auditor
        run: python -m pip install ruff "pip-audit==2.10.1"
      - name: Audit resolved Python dependencies
        run: pip-audit --strict -r "$RUNNER_TEMP/paketscope-audit-requirements.txt"
      - name: Check unused imports and undefined names
        run: ruff check --select F401,F821 paketscope tests
      - name: Compile source
        run: python -m compileall -q paketscope
      - name: Validate source archive contents and required package files
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/paketscope-source-test.tar.gz"
          git -C "$GITHUB_WORKSPACE" archive --format=tar.gz --prefix="paketscope-test/" HEAD:apps/paketscope > "$archive"
          test -s "$archive"
          archive_contents="$(tar -tzf "$archive")"
          printf '%s\n' "$archive_contents" | head -40
          for relative in \
            pyproject.toml \
            README.md \
            debian/control \
            paketscope/__init__.py \
            paketscope/admin_helper.py \
            paketscope/ui/inspection_dialog.py \
            tests/test_code_inspector.py \
            tests/test_system_inspector.py; do
            found=false
            while IFS= read -r archive_path; do
              case "$archive_path" in
                */"$relative") found=true; break ;;
              esac
            done <<< "$archive_contents"
            if [[ "$found" != true ]]; then
              echo "Source archive is missing required file: $relative"
              exit 1
            fi
          done
      - name: Run unit tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  debian-package:
    name: Build, install, and purge on Debian 13
    runs-on: ubuntu-latest
    steps:
      # Checkout happens on the runner, where git is guaranteed to be available.
      # The package is then built and tested inside an isolated Debian 13 container.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and smoke-test the Debian package in a clean container
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run -i --name paketscope-debian-ci --pull=always \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/apps/paketscope \
            debian:trixie bash -s <<'DEBIAN_CI'
          set -euo pipefail
          set -euo pipefail

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev python3 python3-pyside6.qtwidgets \
            python3-cryptography desktop-file-utils

          dpkg-buildpackage --build=binary --no-sign

          package="$(find .. -maxdepth 1 -type f -name 'paketscope_*_all.deb' -print -quit)"
          test -n "$package"
          # Keep an independent copy in the container filesystem for docker cp after tests.
          cp "$package" /tmp/paketscope_3.0.0~dev3_all.deb
          test "$(dpkg-deb -f "$package" Package)" = "paketscope"
          test "$(dpkg-deb -f "$package" Version)" = "3.0.0~dev3"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"

          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$package"
          dpkg-query -W -f='${Status}\n' paketscope | grep -Fx 'install ok installed'
          command -v paketscope
          test -x /usr/bin/paketscope
          desktop-file-validate /usr/share/applications/paketscope.desktop

          # Run outside the checkout and verify Python imports the installed package,
          # not the repository source tree (which could create a false-positive smoke test).
          cd /tmp
          env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B - <<'PYTHON_SMOKE'
          from pathlib import Path
          import paketscope

          module_path = Path(paketscope.__file__).resolve()
          installed_root = Path("/usr/lib/python3/dist-packages").resolve()
          assert module_path.is_relative_to(installed_root), (
              f"Imported source-tree package instead of installed Debian package: {module_path}"
          )
          assert paketscope.__version__ == "3.0.0.dev3", paketscope.__version__
          print(f"Installed package import OK: {module_path} (v{paketscope.__version__})")
          PYTHON_SMOKE

          DEBIAN_FRONTEND=noninteractive apt-get purge -y paketscope
          status="$(dpkg-query -W -f='${db:Status-Abbrev}' paketscope 2>/dev/null || true)"
          if [[ "$status" == ii* ]]; then
            echo "paketscope is still installed after purge (status: $status)"
            exit 1
          fi
          for path in /usr/bin/paketscope /usr/share/applications/paketscope.desktop /usr/lib/python3/dist-packages/paketscope; do
            if [[ -e "$path" ]]; then
              echo "Package-owned path remains after purge: $path"
              exit 1
            fi
          done
          DEBIAN_CI
          container_exit=$?
          set -e
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [[ "$container_exit" -ne 0 ]]; then
            docker logs paketscope-debian-ci || true
            docker rm paketscope-debian-ci || true
            exit "$container_exit"
          fi
          docker cp paketscope-debian-ci:/tmp/paketscope_3.0.0~dev3_all.deb "$GITHUB_WORKSPACE/dist/"
          docker rm paketscope-debian-ci
      - name: Confirm Debian package artifact is visible on the runner
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name "paketscope_*.deb" -print
          test -n "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name "paketscope_*.deb" -print -quit)"
          ls -la "$GITHUB_WORKSPACE/dist"
      - name: Upload Debian 13 development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paketscope-debian13-development
          path: dist/paketscope_*.deb
          if-no-files-found: error
          retention-days: 7

  publish-prerelease:
    name: Publish tagged development release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'paketscope-v')
    needs: [test, debian-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download tested Debian package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paketscope-debian13-development
          path: dist/
      - name: Verify tag, prepare source archive, generate SHA-256, and write release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          deb_version="$(dpkg-deb -f "$package" Version)"
          expected_tag="paketscope-v$(printf '%s' "$deb_version" | tr '~' '-')"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag mismatch: expected $expected_tag for Debian package version $deb_version, got $RELEASE_TAG"
            exit 1
          fi
          source_archive="dist/paketscope_$(printf '%s' "$deb_version")_source.tar.gz"
          git -C "$GITHUB_WORKSPACE" archive --format=tar.gz --prefix="paketscope-$(printf '%s' "$deb_version")/" "HEAD:apps/paketscope" > "$source_archive"
          test -s "$source_archive"
          sha256sum "$package" "$source_archive" > dist/SHA256SUMS
          cat > dist/RELEASE_NOTES.md <<'EOF'
          **Experimental development preview — not a stable release.**

          The Debian package was built and installed/purged in a clean Debian 13 CI container. The source archive is provided for review and experimental source-mode use; it is not a prebuilt installer for every Linux distribution.

          - Tested binary package target: Debian 13.
          - Other distributions may try the source archive with Python 3.10+, pip, and a working Qt desktop runtime, but compatibility is not yet validated.
          - PaketScope currently manages APT packages only. Flatpak inventory is visible, but Flatpak install/remove is not enabled.
          - APT install/remove/purge actions require a transaction preview, explicit confirmation, and the system authentication prompt.
          - Review SHA-256 checksums and the source before use. CI does not replace testing on a real desktop or a security review.
          EOF
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(dpkg-deb -f dist/*.deb Version)"
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*_source.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "PaketScope $version — Development preview" \
            --notes-file dist/RELEASE_NOTES.md
